upstream auth_service {
    server 127.0.0.1:9602;
    keepalive 32;
}

upstream product_service {
    server 127.0.0.1:9601;
    keepalive 32;
}

upstream delivery_service {
    server 127.0.0.1:9603;
    keepalive 32;
}

upstream rabbitmq_management {
    server 127.0.0.1:15672;
    keepalive 8;
}

# --- HTTP → HTTPS Redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name meal-app.run.place;
 
    # Allow certbot renewal challenges over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
 
    # Everything else → HTTPS
    location / {
        return 308 https://$host$request_uri;
    }
}
# --- HTTPS Main Server Block -------------------------------------------------
 
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meal-app.run.place;
 
    # --- SSL Certificates (managed by Certbot) -------------------------------
    ssl_certificate     /etc/letsencrypt/live/meal-app.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meal-app.run.place/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
 
    # --- SSL Hardening -------------------------------------------------------
    # ssl_protocols             TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;      # Let client pick — best practice for TLS 1.3
    # ssl_session_cache         shared:SSL:10m;
    # ssl_session_timeout       1d;
    # ssl_session_tickets       off;      # Disable for better forward secrecy
 
    # --- Security Headers ----------------------------------------------------
    # HSTS — forces HTTPS for 1 year. Only active once you're confident SSL is stable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"       always;
 
    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/meal-app.access.log combined;
    error_log  /var/log/nginx/meal-app.error.log warn;
 
    # --- Request Size --------------------------------------------------------
    client_max_body_size 20M;
 
    # --- Global Proxy Settings -----------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;  # WebSocket support
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
 
    # --- Timeouts ------------------------------------------------------------
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
 
 
    # =========================================================================
    # SERVICE ROUTING
    # Public path     →   Internal path
    # /auth/          →   127.0.0.1:9602/meal-api/v1/auth/
    # /products/      →   127.0.0.1:9601/meal-api/v1/food/
    # /delivery/      →   127.0.0.1:9603/meal-api/v1/delivery/
    # =========================================================================
 
    location /auth/ {
        proxy_pass http://auth_service/meal-api/v1/auth/;
    }
 
    location /products/ {
        proxy_pass http://product_service/meal-api/v1/food/;
    }
 
    location /delivery/ {
        proxy_pass http://delivery_service/meal-api/v1/delivery/;
    }
 
    # --- RabbitMQ Management UI (internal access only) -----------------------
    location /rabbitmq/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 102.89.84.206;
        deny all;
 
        proxy_pass http://rabbitmq_management/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
 
    # --- Health Check --------------------------------------------------------
    location /health {
        access_log off;
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }
 
    # --- Block hidden files (.env, .git, etc) --------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
 
    # --- Catch-all -----------------------------------------------------------
    location / {
        return 404;
    }
}
